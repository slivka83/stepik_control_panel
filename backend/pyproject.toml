[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI Depends/Query in default args is the framework idiom (B008).
# SQLAlchemy string forward-refs in relationships are resolved by the ORM (F821).
[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/models/*.py" = ["F821"]
"app/main.py" = ["E402"]  # logging.basicConfig must run before app imports
# Tests: long SQL fixtures (E501), seed helpers called for side effects (F841),
# nested patch contexts and suppressible assertions are idiomatic in tests.
"tests/*.py" = ["E501", "F841", "B007", "SIM117", "SIM105", "SIM108"]
# Migrations are historical artifacts; tolerant try/except is intentional there.
"migrations/versions/*.py" = ["SIM105", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
